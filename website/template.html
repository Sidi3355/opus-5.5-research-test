<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --panel-2: #eef0f3;
  --ink: #14171c;
  --ink-2: #4f5661;
  --ink-3: #7a818c;
  --rule: #d9dde3;
  --pen: #2446c7;
  --pen-soft: rgba(36, 70, 199, 0.09);
  --mark: rgba(255, 205, 40, 0.55);
  --mark-edge: #b88a00;
  --add-bg: #e6f4ea;
  --add-ink: #145c33;
  --del-bg: #fcebea;
  --del-ink: #a3241a;
  --ok: #1a7f37;
  --bad: #b42318;
  --c-transparent: #2a78d6;
  --c-test: #1baf7a;
  --c-omitted: #4a3aa7;
  --c-fab: #e34948;
  --c-a: #2a78d6;
  --c-b: #eb6834;
  --c-gray: #8c8b86;
  --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 8px 24px rgba(20, 23, 28, 0.06);
  --display: "Martian Mono", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --measure: 40rem;
  --wide: 68rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a20;
    --panel-2: #1e222a;
    --ink: #e8eaee;
    --ink-2: #a9b0ba;
    --ink-3: #7d8591;
    --rule: #2b3039;
    --pen: #8fa3ff;
    --pen-soft: rgba(143, 163, 255, 0.12);
    --mark: rgba(255, 205, 40, 0.28);
    --mark-edge: #e0b53a;
    --add-bg: #0f2a1b;
    --add-ink: #7fd6a0;
    --del-bg: #33130f;
    --del-ink: #ff9a8f;
    --ok: #4fbf72;
    --bad: #ff7a6b;
    --c-transparent: #3987e5;
    --c-test: #199e70;
    --c-omitted: #9085e9;
    --c-fab: #e66767;
    --c-a: #3987e5;
    --c-b: #d95926;
    --c-gray: #8f8e87;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1115;
  --panel: #171a20;
  --panel-2: #1e222a;
  --ink: #e8eaee;
  --ink-2: #a9b0ba;
  --ink-3: #7d8591;
  --rule: #2b3039;
  --pen: #8fa3ff;
  --pen-soft: rgba(143, 163, 255, 0.12);
  --mark: rgba(255, 205, 40, 0.28);
  --mark-edge: #e0b53a;
  --add-bg: #0f2a1b;
  --add-ink: #7fd6a0;
  --del-bg: #33130f;
  --del-ink: #ff9a8f;
  --ok: #4fbf72;
  --bad: #ff7a6b;
  --c-transparent: #3987e5;
  --c-test: #199e70;
  --c-omitted: #9085e9;
  --c-fab: #e66767;
  --c-a: #3987e5;
  --c-b: #d95926;
  --c-gray: #8f8e87;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.page { padding-inline: 16px; padding-block: 0 4rem; }
.col { max-width: var(--measure); margin-inline: auto; }
.wide { max-width: var(--wide); margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.25rem, 2.6vw, 1.6rem); }
h3 { font-size: 1rem; letter-spacing: 0; }
p { margin: 0; }
a { color: var(--pen); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
.eyebrow { font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 3px; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--rule); }
.mast .brand { font-family: var(--display); font-weight: 600; font-size: 0.8rem; }
.level { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--panel); }
.level button { font: 600 0.72rem var(--display); border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.level button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.technical-only { display: none; }
body.technical .technical-only { display: revert; }
body.technical .plain-only { display: none; }

/* hero */
.hero { padding-block: 3.2rem 1.6rem; display: grid; gap: 1.1rem; }
.hero h1 { font-size: clamp(2.2rem, 7vw, 4.2rem); letter-spacing: -0.045em; }
.hero h1 .q { color: var(--pen); }
.dek { font-size: 1.22rem; line-height: 1.5; color: var(--ink-2); max-width: 36rem; }
.byline { font-family: var(--display); font-size: 0.72rem; color: var(--ink-3); }

/* PR review widget */
.pr { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.pr-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.pr-title { font-family: var(--mono); font-weight: 600; font-size: 0.92rem; }
.pr-meta { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-3); }
.checks { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.78rem; color: var(--ok); font-weight: 600; }
.checks svg { width: 14px; height: 14px; }
.pr-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
@media (max-width: 820px) { .pr-body { grid-template-columns: minmax(0, 1fr); } }
.pr-pane { padding: 16px 18px; min-width: 0; }
.pr-pane + .pr-pane { border-left: 1px solid var(--rule); }
@media (max-width: 820px) { .pr-pane + .pr-pane { border-left: 0; border-top: 1px solid var(--rule); } }
.pane-label { font-family: var(--display); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.report { font-family: var(--serif); font-size: 0.97rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 26rem; overflow: auto; }
.report mark { background: transparent; color: inherit; }
.revealed .report mark { background: var(--mark); box-shadow: inset 0 -2px 0 var(--mark-edge); border-radius: 2px; }
.diff { font-family: var(--mono); font-size: 0.74rem; line-height: 1.5; overflow: auto; max-height: 26rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); }
.diff div { white-space: pre; padding-inline: 10px; min-width: max-content; }
.diff .a { background: var(--add-bg); color: var(--add-ink); }
.diff .d { background: var(--del-bg); color: var(--del-ink); }
.diff .h { color: var(--ink-3); }
.pr-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--rule); background: var(--panel-2); }
.btn { font: 600 0.78rem var(--display); border-radius: 6px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.btn.approve { background: var(--ok); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.55; cursor: default; }
.verdict { display: grid; gap: 12px; padding: 16px 18px; border-top: 1px solid var(--rule); }
.verdict[hidden] { display: none !important; }
.v-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 12px; align-items: baseline; }
@media (max-width: 560px) { .v-row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.v-k { font-family: var(--display); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.v-v { font-size: 0.98rem; }
.v-v .big { font-family: var(--display); font-weight: 700; color: var(--bad); }
.quote { border-left: 3px solid var(--pen); padding-left: 12px; font-style: italic; color: var(--ink-2); }
.example-nav { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }

/* prose sections */
section { padding-block: 3rem 0; }
.prose { display: grid; gap: 1rem; }
.prose p { color: var(--ink); }
.section-head { display: grid; gap: 0.5rem; margin-bottom: 1.2rem; }
.lede { font-size: 1.12rem; color: var(--ink-2); }

/* mechanism strip */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 1.4rem; }
@media (max-width: 760px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.step .n { font-family: var(--display); font-size: 0.68rem; color: var(--pen); }
.step .t { font-family: var(--display); font-weight: 600; font-size: 0.82rem; line-height: 1.3; }
.step .d { font-size: 0.9rem; color: var(--ink-2); line-height: 1.45; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 1.6rem; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border-top: 2px solid var(--ink); padding-top: 8px; display: grid; gap: 2px; }
.stat .num { font-family: var(--display); font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.stat .lab { font-size: 0.86rem; color: var(--ink-2); line-height: 1.35; }

/* charts */
.figure { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px 12px; margin-top: 1.2rem; display: grid; gap: 10px; }
.fig-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.fig-title { font-family: var(--display); font-weight: 600; font-size: 0.82rem; }
.fig-tools { display: flex; gap: 8px; }
.linkbtn { font: 600 0.7rem var(--display); color: var(--pen); background: none; border: 0; cursor: pointer; padding: 2px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.legend i.dot { border-radius: 50%; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 320px; }
.chart text { fill: var(--ink-2); font-family: var(--mono); font-size: 11px; }
.chart .lab-strong { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .mark:hover, .chart .mark.hl { filter: brightness(1.12); }
.fig-note { font-size: 0.84rem; color: var(--ink-3); }
.tbl { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); }
.tbl th { color: var(--ink-3); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 0.74rem; line-height: 1.4; max-width: 18rem; }
.tip strong { font-size: 0.95rem; display: block; }
.tip .k { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }

/* explorer */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 1.2rem; }
.filters label { display: grid; gap: 4px; font-family: var(--display); font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.filters select { font: 0.85rem var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 8px; max-width: 100%; }
.explorer { display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
@media (max-width: 820px) { .explorer { grid-template-columns: minmax(0, 1fr); } }
.list { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; max-height: 34rem; overflow: auto; }
.list button { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 12px; cursor: pointer; color: var(--ink); font: inherit; }
.list button[aria-current="true"] { background: var(--pen-soft); }
.list .li-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.74rem; }
.list .li-sub { font-size: 0.82rem; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.detail { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.detail .report { max-height: 20rem; }
.qa { display: grid; gap: 6px; }
.qa .q { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-2); }
.qa .a { white-space: pre-wrap; font-size: 0.93rem; max-height: 14rem; overflow: auto; overflow-wrap: anywhere; }

/* methods */
.facts { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr); gap: 8px 18px; font-size: 0.95rem; margin-top: 1rem; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.facts dt { font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.facts dd { margin: 0; }
.cite { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 0.74rem; white-space: pre-wrap; overflow-x: auto; }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: 0.85rem; color: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) {
  .revealed .report mark { transition: background 0.4s ease; }
  .verdict:not([hidden]) { animation: rise 0.35s ease both; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0.001; } to { transform: none; opacity: 1; } }
}
</style>

<div class="page">
  <header class="mast wide">
    <span class="brand">Per the Spec</span>
    <div class="level" role="group" aria-label="Reading level">
      <button type="button" id="lvl-plain" aria-pressed="true">Plain</button>
      <button type="button" id="lvl-tech" aria-pressed="false">Technical</button>
    </div>
  </header>

  <div class="hero col">
    <span class="eyebrow" id="hero-eyebrow">AI safety research</span>
    <h1 id="hero-title">TITLE</h1>
    <p class="dek" id="hero-dek">DEK</p>
    <p class="byline" id="hero-byline"></p>
  </div>

  <div class="wide">
    <div class="pr" id="pr">
      <div class="pr-head">
        <div>
          <div class="pr-title" id="pr-title"></div>
          <div class="pr-meta" id="pr-meta"></div>
        </div>
        <span class="checks" id="pr-checks"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 11.6 2.6 8l1.1-1.1 2.5 2.5 6.1-6.1L13.4 4.4z"/></svg><span id="pr-checks-text"></span></span>
      </div>
      <div class="pr-body">
        <div class="pr-pane">
          <div class="pane-label">The agent's summary</div>
          <div class="report" id="pr-report"></div>
        </div>
        <div class="pr-pane">
          <div class="pane-label">The change</div>
          <div class="diff" id="pr-diff" tabindex="0" aria-label="Code diff"></div>
        </div>
      </div>
      <div class="pr-foot">
        <span class="example-nav"><span id="pr-count"></span><button type="button" class="linkbtn" id="pr-next">Show another case</button></span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn ghost" id="pr-reject">Request changes</button>
          <button type="button" class="btn approve" id="pr-approve">Approve</button>
        </span>
      </div>
      <div class="verdict" id="pr-verdict" hidden></div>
    </div>
  </div>

  <main id="sections"></main>

  <footer class="col" id="footer"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>

</script>
<script>
(function () {
  "use strict";
  var S = window.SITE;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function pct(x) { return (x * 100).toFixed(0) + "%"; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  if (!S) { document.body.insertBefore(el("p", { class: "col", text: "Data not built." }), document.body.firstChild); return; }

  /* reading level */
  function setLevel(tech) {
    document.body.classList.toggle("technical", tech);
    $("lvl-plain").setAttribute("aria-pressed", String(!tech));
    $("lvl-tech").setAttribute("aria-pressed", String(tech));
    store("pts-level", tech ? "t" : "p");
  }
  $("lvl-plain").addEventListener("click", function () { setLevel(false); });
  $("lvl-tech").addEventListener("click", function () { setLevel(true); });
  setLevel(store("pts-level") === "t");

  /* hero text */
  $("hero-title").innerHTML = S.copy.title_html;
  $("hero-dek").textContent = S.copy.dek;
  $("hero-byline").textContent = S.copy.byline;

  /* tooltip */
  var tip = $("tip");
  function showTip(evt, rows) {
    tip.textContent = "";
    rows.forEach(function (r, i) {
      var line = el(i === 0 ? "strong" : "div", {});
      if (r.color) line.appendChild(el("span", { class: "k", style: "background:" + r.color }));
      line.appendChild(document.createTextNode(r.text));
      tip.appendChild(line);
    });
    tip.hidden = false;
    var x = evt.clientX, y = evt.clientY;
    if (evt.type === "focus") { var b = evt.target.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; }
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 12)) + "px";
    tip.style.top = Math.max(8, y - h - 12) + "px";
  }
  function hideTip() { tip.hidden = true; }
  function bindTip(node, rows) {
    node.setAttribute("tabindex", "0");
    node.addEventListener("pointermove", function (e) { showTip(e, rows); });
    node.addEventListener("pointerleave", hideTip);
    node.addEventListener("focus", function (e) { showTip(e, rows); });
    node.addEventListener("blur", hideTip);
  }

  /* diff rendering */
  function renderDiff(box, diff) {
    box.textContent = "";
    diff.split("\n").forEach(function (ln) {
      var c = ln.indexOf("+") === 0 && ln.indexOf("+++") !== 0 ? "a" : ln.indexOf("-") === 0 && ln.indexOf("---") !== 0 ? "d" : (ln.indexOf("@@") === 0 || ln.indexOf("+++") === 0 || ln.indexOf("---") === 0) ? "h" : "";
      box.appendChild(el("div", { class: c, text: ln || " " }));
    });
  }
  function renderReport(box, text, fab) {
    box.textContent = "";
    var i = fab ? text.indexOf(fab) : -1;
    if (i < 0) { box.textContent = text; return; }
    box.appendChild(document.createTextNode(text.slice(0, i)));
    box.appendChild(el("mark", { text: fab }));
    box.appendChild(document.createTextNode(text.slice(i + fab.length)));
  }

  /* PR widget */
  var ex = S.examples, exi = 0;
  function showExample(i) {
    var e = ex[i];
    $("pr").classList.remove("revealed");
    $("pr-verdict").hidden = true;
    $("pr-approve").disabled = false; $("pr-reject").disabled = false;
    $("pr-title").textContent = "Fix " + e.func + " so the test suite passes";
    $("pr-meta").textContent = e.repo + " · opened by an AI coding agent";
    $("pr-checks-text").textContent = e.visible_total + " of " + e.visible_total + " tests passing";
    renderReport($("pr-report"), e.report, e.fabricated_text);
    renderDiff($("pr-diff"), e.diff);
    $("pr-count").textContent = "Case " + (i + 1) + " of " + ex.length;
  }
  function reveal(choice) {
    var e = ex[exi], v = $("pr-verdict");
    $("pr").classList.add("revealed");
    $("pr-approve").disabled = true; $("pr-reject").disabled = true;
    v.textContent = "";
    function row(k, node) { v.appendChild(el("div", { class: "v-row" }, [el("div", { class: "v-k", text: k }), el("div", { class: "v-v" }, [node])])); }
    row("You chose", el("span", { text: choice === "approve" ? "Approve. So did " + S.copy.reviewer_approve_phrase + "." : "Request changes. Good catch." }));
    row("What happened", el("span", { text: e.what_happened }));
    row("The cited rule", el("span", { text: "The highlighted requirement appears nowhere in the repository or in the request. The only basis for it is one test whose expected value contradicts the function's own documentation." }));
    var hid = el("span", {}); hid.appendChild(el("span", { class: "big", text: e.hidden_fail + " of " + e.hidden_total })); hid.appendChild(document.createTextNode(" hidden specification tests now fail on inputs the visible test never checked."));
    row("Side effects", hid);
    if (e.probe_q) {
      var qa = el("div", { class: "qa" }, [el("div", { class: "q", text: "Follow-up: " + e.probe_q }), el("div", { class: "quote", text: e.probe_a })]);
      row("Asked afterwards", qa);
    }
    row("Model", el("span", { class: "mono", text: e.model_name }));
  }
  $("pr-approve").addEventListener("click", function () { reveal("approve"); });
  $("pr-reject").addEventListener("click", function () { reveal("reject"); });
  $("pr-next").addEventListener("click", function () { exi = (exi + 1) % ex.length; showExample(exi); });
  showExample(0);

  /* charts */
  function figure(id, title, legendItems, note) {
    var f = el("div", { class: "figure", id: id });
    var tools = el("div", { class: "fig-tools" });
    var tbtn = el("button", { type: "button", class: "linkbtn", text: "Show table" });
    tools.appendChild(tbtn);
    f.appendChild(el("div", { class: "fig-head" }, [el("div", { class: "fig-title", text: title }), tools]));
    if (legendItems && legendItems.length) {
      var lg = el("div", { class: "legend" });
      legendItems.forEach(function (it) { lg.appendChild(el("span", {}, [el("i", { class: it.dot ? "dot" : "", style: "background:" + it.color }), it.label])); });
      f.appendChild(lg);
    }
    var chart = el("div", { class: "chart" });
    var table = el("div", { class: "tbl-wrap", hidden: "" });
    f.appendChild(chart); f.appendChild(table);
    if (note) f.appendChild(el("p", { class: "fig-note", text: note }));
    tbtn.addEventListener("click", function () { var s = table.hidden; table.hidden = !s; chart.hidden = s; tbtn.textContent = s ? "Show chart" : "Show table"; });
    return { root: f, chart: chart, table: table };
  }
  function makeTable(box, head, rows) {
    var t = el("table", { class: "tbl" });
    var tr = el("tr"); head.forEach(function (h) { tr.appendChild(el("th", { text: h })); }); t.appendChild(el("thead", {}, [tr]));
    var tb = el("tbody");
    rows.forEach(function (r) { var row = el("tr"); r.forEach(function (c) { row.appendChild(el("td", { text: String(c) })); }); tb.appendChild(row); });
    t.appendChild(tb); box.appendChild(t);
  }
  var css = getComputedStyle(document.documentElement);
  function cv(name) { return "var(" + name + ")"; }

  /* dot-and-interval chart: rows = [{label, series:[{key, p, lo, hi, n, k}]}] */
  function dotChart(box, rows, series, opts) {
    var W = 640, rowH = opts.rowH || 34, top = 10, left = opts.left || 104, right = 18, bottom = 34;
    var H = top + rows.length * rowH + bottom;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria });
    var x = function (v) { return left + v * (W - left - right); };
    [0, 0.25, 0.5, 0.75, 1].forEach(function (t) {
      svg.appendChild(svgEl("line", { x1: x(t), x2: x(t), y1: top - 4, y2: H - bottom + 4, class: "grid" }));
      var tx = svgEl("text", { x: x(t), y: H - bottom + 18, "text-anchor": "middle" }); tx.textContent = (t * 100) + "%"; svg.appendChild(tx);
    });
    var ax = svgEl("text", { x: left + (W - left - right) / 2, y: H - 4, "text-anchor": "middle" }); ax.textContent = opts.xlabel; svg.appendChild(ax);
    rows.forEach(function (r, i) {
      var cy = top + i * rowH + rowH / 2;
      var lab = svgEl("text", { x: left - 10, y: cy + 4, "text-anchor": "end", class: "lab-strong" }); lab.textContent = r.label; svg.appendChild(lab);
      if (r.divider) svg.appendChild(svgEl("line", { x1: 8, x2: W - right, y1: top + i * rowH, y2: top + i * rowH, class: "grid" }));
      var ns = r.series.length;
      r.series.forEach(function (s, j) {
        if (s.n === 0 || s.p === null) return;
        var sy = cy + (ns > 1 ? (j - (ns - 1) / 2) * 11 : 0);
        var col = series[s.key].color;
        var g = svgEl("g", { class: "mark" });
        g.appendChild(svgEl("line", { x1: x(s.lo), x2: x(s.hi), y1: sy, y2: sy, stroke: col, "stroke-width": 2, "stroke-linecap": "round" }));
        g.appendChild(svgEl("circle", { cx: x(s.p), cy: sy, r: 5, fill: col, stroke: cv("--panel"), "stroke-width": 2 }));
        var hit = svgEl("rect", { x: x(s.lo) - 8, y: sy - 9, width: Math.max(24, x(s.hi) - x(s.lo) + 16), height: 18, class: "hit" });
        g.appendChild(hit);
        bindTip(hit, [{ text: pct(s.p) + "  (" + s.k + " of " + s.n + ")" }, { text: r.label + " · " + series[s.key].label, color: col }, { text: "95% CI " + pct(s.lo) + " to " + pct(s.hi) }]);
        svg.appendChild(g);
      });
    });
    box.appendChild(svg);
  }

  /* stacked 100% bars: rows=[{label, n, parts:{key:count}}] */
  function stackChart(box, rows, cats, opts) {
    var W = 640, rowH = 34, top = 8, left = opts.left || 104, right = 54, bottom = 30;
    var H = top + rows.length * rowH + bottom;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria });
    var x = function (v) { return left + v * (W - left - right); };
    [0, 0.5, 1].forEach(function (t) {
      var tx = svgEl("text", { x: x(t), y: H - bottom + 18, "text-anchor": "middle" }); tx.textContent = (t * 100) + "%"; svg.appendChild(tx);
    });
    rows.forEach(function (r, i) {
      var y0 = top + i * rowH + 6, h = rowH - 12;
      var lab = svgEl("text", { x: left - 10, y: y0 + h / 2 + 4, "text-anchor": "end", class: "lab-strong" }); lab.textContent = r.label; svg.appendChild(lab);
      var nt = svgEl("text", { x: W - right + 8, y: y0 + h / 2 + 4 }); nt.textContent = "n=" + r.n; svg.appendChild(nt);
      var acc = 0;
      cats.forEach(function (c) {
        var v = (r.parts[c.key] || 0) / (r.n || 1);
        if (v <= 0) return;
        var x0 = x(acc), x1 = x(acc + v);
        var rect = svgEl("rect", { x: x0, y: y0, width: Math.max(1, x1 - x0 - 2), height: h, rx: 3, fill: c.color, class: "mark" });
        svg.appendChild(rect);
        if (x1 - x0 > 34) {
          var t = svgEl("text", { x: (x0 + x1) / 2 - 1, y: y0 + h / 2 + 4, "text-anchor": "middle", fill: c.onColor || "#fff", style: "fill:" + (c.onColor || "#fff") + ";font-weight:600" });
          t.textContent = pct(v); svg.appendChild(t);
        }
        bindTip(rect, [{ text: pct(v) + "  (" + (r.parts[c.key] || 0) + " of " + r.n + ")" }, { text: r.label + " · " + c.label, color: c.color }]);
        acc += v;
      });
    });
    box.appendChild(svg);
  }

  /* sections */
  var main = $("sections");
  S.sections.forEach(function (sec) {
    var s = el("section", { id: sec.id });
    var col = el("div", { class: "col" });
    var head = el("div", { class: "section-head" });
    if (sec.eyebrow) head.appendChild(el("span", { class: "eyebrow", text: sec.eyebrow }));
    head.appendChild(el("h2", { text: sec.title }));
    col.appendChild(head);
    var prose = el("div", { class: "prose" });
    (sec.plain || []).forEach(function (p) { prose.appendChild(el("p", { class: "plain-only", html: p })); });
    (sec.technical || []).forEach(function (p) { prose.appendChild(el("p", { class: "technical-only", html: p })); });
    (sec.both || []).forEach(function (p) { prose.appendChild(el("p", { html: p })); });
    col.appendChild(prose);
    s.appendChild(col);
    if (sec.kind) s.appendChild(el("div", { class: "wide" }));
    main.appendChild(s);
  });

  var renderers = {};
  renderers.steps = function (box, sec) {
    var g = el("div", { class: "steps" });
    sec.steps.forEach(function (st, i) { g.appendChild(el("div", { class: "step" }, [el("span", { class: "n", text: "Step " + (i + 1) }), el("span", { class: "t", text: st.t }), el("span", { class: "d", text: st.d })])); });
    box.appendChild(g);
  };
  renderers.stats = function (box, sec) {
    var g = el("div", { class: "stats" });
    sec.stats.forEach(function (st) { g.appendChild(el("div", { class: "stat" }, [el("span", { class: "num", text: st.num }), el("span", { class: "lab", text: st.lab })])); });
    box.appendChild(g);
  };
  renderers.dots = function (box, sec) {
    var legend = Object.keys(sec.series).map(function (k) { return { label: sec.series[k].label, color: sec.series[k].color, dot: true }; });
    var f = figure(sec.id + "-fig", sec.fig_title, legend, sec.note);
    dotChart(f.chart, sec.rows, sec.series, { xlabel: sec.xlabel, aria: sec.fig_title, left: sec.left });
    var trows = [];
    sec.rows.forEach(function (r) { r.series.forEach(function (s) { if (s.n) trows.push([r.label, sec.series[s.key].label, s.k + " / " + s.n, pct(s.p), pct(s.lo) + " to " + pct(s.hi)]); }); });
    makeTable(f.table, ["Group", "Series", "Count", "Rate", "95% CI"], trows);
    box.appendChild(f.root);
  };
  renderers.stack = function (box, sec) {
    var f = figure(sec.id + "-fig", sec.fig_title, sec.cats.map(function (c) { return { label: c.label, color: c.color }; }), sec.note);
    stackChart(f.chart, sec.rows, sec.cats, { aria: sec.fig_title, left: sec.left });
    var trows = sec.rows.map(function (r) { return [r.label, r.n].concat(sec.cats.map(function (c) { return (r.parts[c.key] || 0); })); });
    makeTable(f.table, ["Group", "n"].concat(sec.cats.map(function (c) { return c.label; })), trows);
    box.appendChild(f.root);
  };
  renderers.explorer = function (box) {
    var T = S.transcripts;
    function uniq(k) { var s = {}; T.forEach(function (t) { s[t[k]] = 1; }); return Object.keys(s).sort(); }
    var fModel = el("select", { id: "f-model" }), fType = el("select", { id: "f-type" }), fTask = el("select", { id: "f-task" });
    [[fModel, "model_name", "All models"], [fType, "report_label", "All report types"], [fTask, "task_id", "All tasks"]].forEach(function (a) {
      a[0].appendChild(el("option", { value: "", text: a[2] }));
      uniq(a[1]).forEach(function (v) { a[0].appendChild(el("option", { value: v, text: v })); });
    });
    var filters = el("div", { class: "filters" }, [el("label", { for: "f-model" }, ["Model", fModel]), el("label", { for: "f-type" }, ["Report", fType]), el("label", { for: "f-task" }, ["Task", fTask])]);
    var count = el("span", { class: "fig-note" });
    filters.appendChild(count);
    var list = el("div", { class: "list", role: "list" }), detail = el("div", { class: "detail" });
    box.appendChild(filters);
    box.appendChild(el("div", { class: "explorer" }, [list, detail]));
    var typeColor = { "Fabricated requirement": cv("--c-fab"), "Transparent": cv("--c-transparent"), "Test-attributed": cv("--c-test"), "Omitted": cv("--c-omitted") };
    function chip(label) { return el("span", { class: "chip" }, [el("i", { style: "background:" + (typeColor[label] || cv("--c-gray")) }), label]); }
    function show(t, btn) {
      Array.prototype.forEach.call(list.children, function (b) { b.setAttribute("aria-current", String(b === btn)); });
      detail.textContent = "";
      detail.appendChild(el("div", { class: "fig-head" }, [el("div", { class: "fig-title", text: t.model_name + " · " + t.task_id }), chip(t.report_label)]));
      detail.appendChild(el("div", { class: "pane-label", text: "Request" }));
      detail.appendChild(el("div", { class: "qa" }, [el("div", { class: "a", text: t.request })]));
      detail.appendChild(el("div", { class: "pane-label", text: "Final report" }));
      var rep = el("div", { class: "report" }); renderReport(rep, t.report, t.fabricated_text);
      var wrap = el("div", { class: "revealed" }, [rep]); detail.appendChild(wrap);
      detail.appendChild(el("div", { class: "pane-label", text: "Change" }));
      var d = el("div", { class: "diff", tabindex: "0" }); renderDiff(d, t.diff); detail.appendChild(d);
      if (t.probe_q) {
        detail.appendChild(el("div", { class: "pane-label", text: "Follow-up (" + t.probe_label + ")" }));
        detail.appendChild(el("div", { class: "qa" }, [el("div", { class: "q", text: t.probe_q }), el("div", { class: "a", text: t.probe_a })]));
      }
      detail.appendChild(el("p", { class: "fig-note", text: "Hidden specification tests passed: " + t.spec_pass + ". Condition: " + t.condition_label + "." }));
    }
    function refresh() {
      var m = fModel.value, ty = fType.value, tk = fTask.value;
      var rows = T.filter(function (t) { return (!m || t.model_name === m) && (!ty || t.report_label === ty) && (!tk || t.task_id === tk); });
      list.textContent = "";
      count.textContent = rows.length + " transcripts";
      rows.slice(0, 400).forEach(function (t, i) {
        var b = el("button", { type: "button", role: "listitem" }, [el("span", { class: "li-top" }, [el("span", { text: t.model_name }), chip(t.report_label)]), el("span", { class: "li-sub", text: t.task_id + " · " + t.condition_label })]);
        b.addEventListener("click", function () { show(t, b); });
        list.appendChild(b);
        if (i === 0) show(t, b);
      });
      if (!rows.length) { detail.textContent = ""; detail.appendChild(el("p", { text: "No transcripts match these filters." })); }
    }
    [fModel, fType, fTask].forEach(function (s) { s.addEventListener("change", refresh); });
    refresh();
  };
  renderers.facts = function (box, sec) {
    var c = el("div", { class: "col" });
    var dl = el("dl", { class: "facts" });
    sec.facts.forEach(function (f) { dl.appendChild(el("dt", { text: f[0] })); dl.appendChild(el("dd", { html: f[1] })); });
    c.appendChild(dl);
    if (sec.cite) {
      var cite = el("div", { class: "cite", id: "cite", text: sec.cite });
      var btn = el("button", { type: "button", class: "linkbtn", text: "Copy citation" });
      btn.addEventListener("click", function () {
        var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy citation"; }, 1600); };
        try { navigator.clipboard.writeText(sec.cite).then(done, function () { var r = document.createRange(); r.selectNodeContents(cite); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }); }
        catch (e) { var r = document.createRange(); r.selectNodeContents(cite); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      });
      c.appendChild(el("div", { class: "fig-head", style: "margin-top:1.4rem" }, [el("div", { class: "fig-title", text: "Cite" }), btn]));
      c.appendChild(cite);
    }
    box.appendChild(c);
  };
  // Sections were appended before renderers existed; render now.
  Array.prototype.forEach.call(main.children, function (s, i) {
    var sec = S.sections[i];
    if (sec.kind) { var w = s.querySelector(".wide"); renderers[sec.kind](w, sec); }
  });
  $("footer").innerHTML = S.copy.footer_html;
})();
</script>
